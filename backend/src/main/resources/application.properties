# 应用配置
spring.application.name=bwxw
server.port=8080
spring.config.import=optional:file:./config/application-local.properties

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/alone?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# 跨域配置（允许前端访问）
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# 文件上传配置
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.upload.dir=uploads

# 首次启动且数据库中没有管理员时，可通过环境变量创建首个超级管理员
app.bootstrap-admin.username=${SMART_DORM_BOOTSTRAP_USERNAME:}
app.bootstrap-admin.password=${SMART_DORM_BOOTSTRAP_PASSWORD:}
app.bootstrap-admin.name=${SMART_DORM_BOOTSTRAP_NAME:系统管理员}

# 日志配置（生产环境）
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.catalina=WARN
